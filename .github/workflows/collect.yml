name: Poll Outage Summary

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes
  workflow_dispatch:

jobs:
  poll:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0   # needed to access previous files

      - name: Download new summary
        run: |
          mkdir -p data
          curl -s https://outagemap-data.cloud.coop/hwecoop/Hosted_Outage_Map/summary.json \
            -o new.json

      - name: Determine latest saved file
        id: latest
        run: |
          latest_file=$(ls -1 data/*.json 2>/dev/null | sort | tail -n 1 || echo "")
          echo "latest_file=$latest_file" >> $GITHUB_OUTPUT

      - name: Compare new summary to latest
        id: compare
        run: |
          if [ -z "${{ steps.latest.outputs.latest_file }}" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            if diff -q new.json "${{ steps.latest.outputs.latest_file }}" > /dev/null; then
              echo "changed=false" >> $GITHUB_OUTPUT
            else
              echo "changed=true" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Save new snapshot if changed
        if: steps.compare.outputs.changed == 'true'
        run: |
          timestamp=$(date -u +"%Y-%m-%dT%H-%M-%SZ")
          cp new.json data/$timestamp.json

      - name: Commit and push if changed
        if: steps.compare.outputs.changed == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/
          git commit -m "New outage snapshot at $(date -u +"%Y-%m-%dT%H:%M:%SZ")" || echo "No changes"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
