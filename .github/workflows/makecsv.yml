name: Build CSV from JSON history

on:
  workflow_dispatch:

jobs:
  build-csv:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Debug file state
        run: |
          echo "Current directory:"
          pwd
          echo "Files:"
          ls -R .

      # ------------------------------------------------------------
      # 1. Discover township list (newline-separated, safe for spaces)
      # ------------------------------------------------------------
      - name: Discover township list
        id: towns
        run: |
          sample=$(ls data/*.json | head -n 1)

          towns=$(jq -r '
            .regionDataSets[]
            | select(.id=="townships")
            | .regions[].id
          ' "$sample" | sort)

          {
            echo "towns<<EOF"
            echo "$towns"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------
      # 2. Create CSV header if missing
      # ------------------------------------------------------------
      - name: Ensure data.csv exists with dynamic header
        run: |
          if [ ! -f data.csv ]; then
            header="timestamp,totalOut,totalServed,outageCount"

            # Read township list safely (newline-separated)
            towns="${{ steps.towns.outputs.towns }}"
            IFS=$'\n' read -r -a town_array <<< "$towns"

            for t in "${town_array[@]}"; do
              header="$header,$t"
            done

            echo "$header" > data.csv
          fi

      # ------------------------------------------------------------
      # 3. Process JSON files and append missing rows
      # ------------------------------------------------------------
      - name: Process JSON files
        run: |
          towns="${{ steps.towns.outputs.towns }}"
          IFS=$'\n' read -r -a town_array <<< "$towns"

          for file in data/*.json; do
            ts=$(basename "$file" .json)

            # Skip if timestamp already exists
            if grep -q "$ts" data.csv; then
              continue
            fi

            totalOut=$(jq '[.regionDataSets[].regions[].numberOut] | add' "$file")
            totalServed=$(jq '.totalServed' "$file")
            outageCount=$(jq '.outages | length' "$file")

            row="$ts,$totalOut,$totalServed,$outageCount"

            # Append each township's numberOut
            for t in "${town_array[@]}"; do
              val=$(jq -r --arg t "$t" '
                .regionDataSets[]
                | select(.id=="townships")
                | .regions[]
                | select(.id==$t)
                | .numberOut
              ' "$file")

              # Default to 0 if missing or null
              if [ -z "$val" ] || [ "$val" = "null" ]; then
                val=0
              fi

              row="$row,$val"
            done

            echo "$row" >> data.csv
          done

      # ------------------------------------------------------------
      # 4. Commit changes safely with rebase
      # ------------------------------------------------------------
      - name: Commit CSV if changed
        run: |
          git pull --rebase origin main || true

          if git diff --quiet; then
            echo "No changes to commit."
          else
            git config user.name "github-actions"
            git config user.email "github-actions@github.com"
            git add data.csv
            git commit -m "Update data.csv with township columns"
            git push
          fi
