name: Build CSV from JSON history

on:
  workflow_dispatch:

jobs:
  build-csv:
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------
      # 0. Checkout main branch (CRITICAL FIX)
      # ------------------------------------------------------------
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Debug initial state
        run: |
          echo "Current directory:"
          pwd
          echo "Files:"
          ls -al .
          echo "Data folder:"
          ls -al data

      # ------------------------------------------------------------
      # 1. Discover township list
      # ------------------------------------------------------------
      - name: Discover township list
        id: towns
        run: |
          sample=$(ls data/*.json | head -n 1)

          towns=$(jq -r '
            .regionDataSets[]
            | select(.id=="townships")
            | .regions[].id
          ' "$sample" | sort)

          {
            echo "towns<<EOF"
            echo "$towns"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------
      # 2. Create CSV header if missing
      # ------------------------------------------------------------
      - name: Ensure data.csv exists with dynamic header
        run: |
          if [ ! -f data.csv ]; then
            echo "Creating data.csv header..."

            towns="${{ steps.towns.outputs.towns }}"

            towns=$(echo "$towns" \
              | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//' \
              | sed 's/ /_/g')

            mapfile -t town_array <<< "$towns"

            header="timestamp,totalOut,totalServed,outageCount"

            for t in "${town_array[@]}"; do
              header="$header,$t"
            done

            echo "$header" > data.csv
            echo "Header created:"
            echo "$header"
          else
            echo "data.csv already exists, skipping header creation."
          fi

      # ------------------------------------------------------------
      # 3. Process JSON files
      # ------------------------------------------------------------
      - name: Process JSON files
        run: |
          towns="${{ steps.towns.outputs.towns }}"

          towns=$(echo "$towns" \
            | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//' \
            | sed 's/ /_/g')

          mapfile -t town_array <<< "$towns"

          for file in data/*.json; do
            ts=$(basename "$file" .json)

            if grep -q "$ts" data.csv; then
              echo "Skipping $ts (already exists)"
              continue
            fi

            echo "Processing $ts..."

            totalOut=$(jq '[.regionDataSets[].regions[].numberOut] | add' "$file")
            totalServed=$(jq '.totalServed' "$file")
            outageCount=$(jq '.outages | length' "$file")

            row="$ts,$totalOut,$totalServed,$outageCount"

            for t in "${town_array[@]}"; do
              val=$(jq -r --arg t "$t" '
                .regionDataSets[]
                | select(.id=="townships")
                | .regions[]
                | select(.id==$t)
                | .numberOut
              ' "$file")

              if [ -z "$val" ] || [ "$val" = "null" ]; then
                val=0
              fi

              row="$row,$val"
            done

            echo "$row" >> data.csv
            echo "Added row for $ts"
          done

      # ------------------------------------------------------------
      # 4. Commit changes (FIXED)
      # ------------------------------------------------------------
      - name: Commit CSV if changed
        run: |
          echo "Git status BEFORE staging:"
          git status

          # FIX: Set identity so commit works
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add -f data.csv

          echo "Git status AFTER staging:"
          git status

          if git diff --cached --quiet; then
            echo "No staged changes to commit."
            exit 0
          fi

          git commit -m "Update data.csv with township columns"

          git pull --rebase origin main || true

          git push
